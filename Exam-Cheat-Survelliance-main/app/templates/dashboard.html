<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamGuard AI | Surveillance Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            /* Slate 950 */
            color: #f1f5f9;
            overflow-x: hidden;
        }

        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .glow-primary {
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        }

        .pulse-live {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Video Frame Styling */
        #video-container {
            position: relative;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
            border-radius: 1rem;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <!-- Load Dependencies via ESM -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.263.1"
      }
    }
    </script>

    <script type="module">
        import React, { useState, useEffect, useRef, useMemo } from 'react';
        import { createRoot } from 'react-dom';
        import * as Lucide from 'lucide-react';

        const {
            Shield, Camera, Users, AlertTriangle, Activity,
            Settings, LogOut, ChevronRight, Bell, Maximize2,
            Eye, RefreshCw, UserPlus, Info, CheckCircle, XCircle
        } = Lucide;

        // --- Components ---

        const SidebarItem = ({ icon: Icon, label, active, onClick }) => (
            <button
                onClick={onClick}
                className={`flex items-center space-x-3 w-full p-3 rounded-xl transition-all duration-200 ${active
                        ? 'bg-sky-500/10 text-sky-400 border border-sky-500/20'
                        : 'text-slate-400 hover:text-slate-100 hover:bg-white/5'
                    }`}
            >
                <Icon size={20} />
                <span className="font-medium">{label}</span>
                {active && <div className="ml-auto w-1.5 h-1.5 rounded-full bg-sky-400 animate-pulse" />}
            </button>
        );

        const StatCard = ({ icon: Icon, label, value, color, trend }) => (
            <div className="glass-card rounded-2xl p-5 flex flex-col space-y-2">
                <div className="flex items-center justify-between">
                    <div className={`p-2 rounded-lg bg-${color}-500/10 text-${color}-400`}>
                        <Icon size={20} />
                    </div>
                    {trend && (
                        <span className={`text-xs font-semibold px-2 py-0.5 rounded-full ${trend.positive ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'
                            }`}>
                            {trend.value}
                        </span>
                    )}
                </div>
                <div className="mt-2">
                    <p className="text-slate-400 text-xs font-medium uppercase tracking-wider">{label}</p>
                    <p className="text-2xl font-bold text-white">{value}</p>
                </div>
            </div>
        );

        const AlertItem = ({ msg, type, time }) => {
            const config = {
                cheat: { icon: AlertTriangle, color: 'rose', bg: 'rose-500/10' },
                peek: { icon: Eye, color: 'amber', bg: 'amber-500/10' },
                down: { icon: Info, color: 'sky', bg: 'sky-500/10' },
                system: { icon: Activity, color: 'emerald', bg: 'emerald-500/10' }
            }[type] || { icon: Info, color: 'slate', bg: 'slate-500/10' };

            return (
                <div className="flex items-start space-x-3 p-3 rounded-xl border border-white/5 hover:bg-white/[0.02] transition-colors">
                    <div className={`mt-0.5 p-2 rounded-lg bg-${config.color}-500/20 text-${config.color}-400`}>
                        <config.icon size={16} />
                    </div>
                    <div className="flex-1">
                        <p className="text-sm text-slate-200 line-clamp-2">{msg}</p>
                        <p className="text-[10px] text-slate-500 mt-1 uppercase font-bold">{time}</p>
                    </div>
                </div>
            );
        };

        // --- Main App ---

        function App() {
            const [isStreaming, setIsStreaming] = useState(false);
            const [processedFrame, setProcessedFrame] = useState(null);
            const [alerts, setAlerts] = useState([]);
            const [violationCount, setViolationCount] = useState(0);
            const [isMirrored, setIsMirrored] = useState(false);
            const [wsStatus, setWsStatus] = useState('offline');
            const [studentName, setStudentName] = useState("");
            const [activeTab, setActiveTab] = useState('surveillance');

            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const wsRef = useRef(null);
            const requestRef = useRef(null);

            // Audio for alerts (optional)
            const alertSound = useMemo(() => new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3'), []);

            useEffect(() => {
                // Initialize canvas
                canvasRef.current = document.createElement('canvas');
                canvasRef.current.width = 640;
                canvasRef.current.height = 480;

                return () => {
                    stopCamera();
                    if (wsRef.current) wsRef.current.close();
                };
            }, []);

            const connectWS = () => {
                const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
                const host = window.location.host || "127.0.0.1:8000";
                const wsUrl = `${protocol}://${host}/ws/surveillance`;

                setWsStatus('connecting');

                const socket = new WebSocket(wsUrl);
                wsRef.current = socket;

                socket.onopen = () => {
                    setWsStatus('online');
                    addAlert("System established secure connection", "system");
                };

                socket.onclose = () => {
                    setWsStatus('offline');
                    setIsStreaming(false);
                    addAlert("System connection lost", "cheat");
                };

                socket.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);

                        if (data.type === "registration_result") {
                            addAlert(`Registration ${data.status}: ${data.message}`, data.status === "success" ? "system" : "cheat");
                        }

                        if (data.type === "frame_result") {
                            if (data.frame) {
                                setProcessedFrame(`data:image/jpeg;base64,${data.frame}`);
                            }
                            if (data.alerts && data.alerts.length > 0) {
                                data.alerts.forEach(msg => {
                                    let type = "cheat";
                                    if (msg.toLowerCase().includes("down")) type = "down";
                                    else if (msg.toLowerCase().includes("peek") || msg.toLowerCase().includes("looking")) type = "peek";

                                    addAlert(msg, type);
                                    if (type === "cheat") {
                                        setViolationCount(prev => prev + 1);
                                        // alertSound.play().catch(() => {}); // Browsers might block this
                                    }
                                });
                            }
                        }
                    } catch (e) {
                        console.error("WS Message error:", e);
                    }
                };
            };

            const startCamera = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { width: 640, height: 480 }
                    });
                    if (videoRef.current) {
                        videoRef.current.srcObject = stream;
                        setIsStreaming(true);
                        connectWS();
                        requestRef.current = requestAnimationFrame(sendFrame);
                    }
                } catch (err) {
                    addAlert("Camera access denied: " + err.message, "cheat");
                }
            };

            const stopCamera = () => {
                if (videoRef.current && videoRef.current.srcObject) {
                    videoRef.current.srcObject.getTracks().forEach(track => track.stop());
                }
                setIsStreaming(false);
                cancelAnimationFrame(requestRef.current);
                if (wsRef.current) wsRef.current.close();
            };

            const sendFrame = () => {
                if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN && videoRef.current && videoRef.current.readyState === videoRef.current.HAVE_ENOUGH_DATA) {
                    const ctx = canvasRef.current.getContext('2d');
                    ctx.drawImage(videoRef.current, 0, 0, 640, 480);
                    const base64 = canvasRef.current.toDataURL('image/jpeg', 0.8).split(',')[1];

                    wsRef.current.send(JSON.stringify({
                        type: "frame",
                        frame: base64,
                        mirror: isMirrored
                    }));
                }
                requestRef.current = requestAnimationFrame(sendFrame);
            };

            const handleRegister = () => {
                if (!studentName) {
                    addAlert("Please enter a student name first", "down");
                    return;
                }
                if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN && videoRef.current) {
                    const ctx = canvasRef.current.getContext('2d');
                    ctx.drawImage(videoRef.current, 0, 0, 640, 480);
                    const base64 = canvasRef.current.toDataURL('image/jpeg', 0.8).split(',')[1];

                    wsRef.current.send(JSON.stringify({
                        type: "register",
                        name: studentName,
                        frame: base64,
                        mirror: isMirrored
                    }));
                } else {
                    addAlert("System not active for registration", "cheat");
                }
            };

            const addAlert = (msg, type) => {
                const newAlert = {
                    id: Date.now() + Math.random(),
                    msg,
                    type,
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
                };
                setAlerts(prev => [newAlert, ...prev].slice(0, 50));
            };

            return (
                <div className="flex h-screen w-screen overflow-hidden">
                    {/* --- Sidebar --- */}
                    <aside className="w-72 glass border-r border-white/10 flex flex-col p-6 z-20">
                        <div className="flex items-center space-x-3 mb-10 px-2 transition-transform hover:scale-105 cursor-pointer">
                            <div className="bg-sky-500 p-2 rounded-xl shadow-lg shadow-sky-500/20">
                                <Shield className="text-white" size={24} />
                            </div>
                            <span className="text-xl font-bold tracking-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">
                                ExamGuard <span className="text-sky-400">AI</span>
                            </span>
                        </div>

                        <nav className="flex-1 space-y-2">
                            <p className="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em] mb-4 px-3">Main Menu</p>
                            <SidebarItem icon={Activity} label="Surveillance" active={activeTab === 'surveillance'} onClick={() => setActiveTab('surveillance')} />
                            <SidebarItem icon={Users} label="Student Database" active={activeTab === 'students'} onClick={() => setActiveTab('students')} />
                            <SidebarItem icon={Bell} label="Forensics Log" active={activeTab === 'logs'} onClick={() => setActiveTab('logs')} />

                            <div className="pt-8 block">
                                <p className="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em] mb-4 px-3">Quick Controls</p>
                                <div className="px-3 space-y-4">
                                    <div className="flex items-center justify-between p-2 rounded-lg bg-white/5 border border-white/5">
                                        <span className="text-xs text-slate-400">Mirror Feed</span>
                                        <button
                                            onClick={() => setIsMirrored(!isMirrored)}
                                            className={`w-10 h-5 rounded-full transition-colors relative ${isMirrored ? 'bg-sky-500' : 'bg-slate-700'}`}
                                        >
                                            <div className={`absolute top-1 left-1 w-3 h-3 bg-white rounded-full transition-transform ${isMirrored ? 'translate-x-5' : ''}`} />
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </nav>

                        <div className="mt-auto pt-6 border-t border-white/5">
                            <SidebarItem icon={LogOut} label="Emergency Stop" onClick={stopCamera} />
                        </div>
                    </aside>

                    {/* --- Main Content --- */}
                    <main className="flex-1 overflow-y-auto custom-scrollbar bg-[radial-gradient(circle_at_top_right,rgba(15,23,42,0.8),transparent)] p-8">
                        {/* Header */}
                        <header className="flex items-center justify-between mb-8">
                            <div>
                                <h1 className="text-3xl font-bold text-white mb-1">Live Monitor</h1>
                                <p className="text-slate-400">Real-time behavior analysis and peer-to-peer verification.</p>
                            </div>
                            <div className="flex items-center space-x-4">
                                <div className={`flex items-center space-x-2 px-4 py-2 rounded-full border ${wsStatus === 'online' ? 'bg-emerald-500/10 border-emerald-500/20 text-emerald-400' :
                                        wsStatus === 'connecting' ? 'bg-amber-500/10 border-amber-500/20 text-amber-400' :
                                            'bg-rose-500/10 border-rose-500/20 text-rose-400'
                                    }`}>
                                    <div className={`w-2 h-2 rounded-full ${wsStatus === 'online' ? 'bg-emerald-500 pulse-live' :
                                            wsStatus === 'connecting' ? 'bg-amber-500 animate-spin' :
                                                'bg-rose-500'
                                        }`} />
                                    <span className="text-xs font-bold uppercase tracking-wider">{wsStatus}</span>
                                </div>
                                <button className="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-white/5">
                                    <Maximize2 size={20} />
                                </button>
                                <button className="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-white/5">
                                    <Settings size={20} />
                                </button>
                            </div>
                        </header>

                        {/* Top Stats */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                            <StatCard icon={Shield} label="System Health" value="OPTIMAL" color="emerald" trend={{ value: '100%', positive: true }} />
                            <StatCard icon={AlertTriangle} label="Total Violations" value={violationCount} color="rose" trend={{ value: '+2 New', positive: false }} />
                            <StatCard icon={Users} label="Students Found" value="1" color="sky" />
                            <StatCard icon={Activity} label="Frame Latency" value="42ms" color="amber" />
                        </div>

                        <div className="grid grid-cols-3 gap-8 h-[600px]">
                            {/* Video Section */}
                            <div className="col-span-2 flex flex-col space-y-4">
                                <div id="video-container" className="flex-1 bg-black relative group shadow-2xl overflow-hidden rounded-3xl border border-white/10">
                                    <video ref={videoRef} autoPlay playsInline muted className="hidden" />

                                    {processedFrame ? (
                                        <img src={processedFrame} className="w-full h-full object-cover" />
                                    ) : (
                                        <div className="absolute inset-0 flex flex-col items-center justify-center space-y-4">
                                            <div className="p-6 rounded-full bg-sky-500/10 text-sky-400 border border-sky-500/20 animate-pulse">
                                                <Camera size={48} />
                                            </div>
                                            <p className="text-slate-400 font-medium">Camera Feed Offline</p>
                                            <button
                                                onClick={startCamera}
                                                className="px-8 py-3 bg-sky-500 hover:bg-sky-400 text-white rounded-2xl font-bold shadow-lg shadow-sky-500/20 transition-all hover:scale-105 active:scale-95"
                                            >
                                                Initialize Dashboard
                                            </button>
                                        </div>
                                    )}

                                    {/* Overlay UI */}
                                    <div className="absolute top-6 left-6 flex space-x-3 pointer-events-none">
                                        <div className="glass px-3 py-1.5 rounded-full flex items-center space-x-2 text-[10px] font-bold uppercase text-white border border-white/10 shadow-xl">
                                            <div className="w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse" />
                                            <span>Live Feed</span>
                                        </div>
                                        <div className="glass px-3 py-1.5 rounded-full flex items-center space-x-2 text-[10px] font-bold uppercase text-white border border-white/10 shadow-xl">
                                            <RefreshCw size={12} />
                                            <span>AI Processor Active</span>
                                        </div>
                                    </div>

                                    <div className="absolute bottom-6 right-6 flex space-x-3">
                                        <button onClick={stopCamera} className="glass p-3 rounded-2xl text-slate-300 hover:text-rose-400 hover:bg-rose-500/10 border-white/10 transition-all">
                                            <LogOut size={20} />
                                        </button>
                                    </div>
                                </div>

                                {/* Quick Actions Row */}
                                <div className="glass rounded-3xl p-6 flex flex-wrap gap-4 items-center border border-white/5">
                                    <div className="flex-1 min-w-[200px]">
                                        <div className="relative group">
                                            <UserPlus className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-sky-400 transition-colors" size={20} />
                                            <input
                                                type="text"
                                                value={studentName}
                                                onChange={(e) => setStudentName(e.target.value)}
                                                placeholder="Registration Name (e.g. Student_01)"
                                                className="w-full bg-slate-900 border border-white/5 rounded-2xl py-3.5 pl-12 pr-4 text-white placeholder-slate-600 focus:outline-none focus:border-sky-500/50 focus:ring-4 focus:ring-sky-500/10 transition-all"
                                            />
                                        </div>
                                    </div>
                                    <button
                                        onClick={handleRegister}
                                        className="px-6 py-3.5 bg-white/5 hover:bg-white/10 text-white rounded-2xl font-bold border border-white/10 transition-all flex items-center space-x-2"
                                    >
                                        <CheckCircle size={20} className="text-sky-400" />
                                        <span>Capture Identity</span>
                                    </button>
                                </div>
                            </div>

                            {/* Sidebar Alerts Section */}
                            <div className="flex flex-col h-full bg-slate-900/40 rounded-3xl border border-white/5 overflow-hidden">
                                <div className="p-6 border-b border-white/5 flex items-center justify-between">
                                    <div>
                                        <h3 className="font-bold text-white">Security Alerts</h3>
                                        <p className="text-[10px] text-slate-500 uppercase font-bold tracking-widest mt-0.5">Real-time Audit</p>
                                    </div>
                                    <div className="bg-rose-500/10 text-rose-400 px-2 py-1 rounded text-[10px] font-bold">
                                        {alerts.length} ITEMS
                                    </div>
                                </div>
                                <div className="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar">
                                    {alerts.length > 0 ? (
                                        alerts.map(alert => (
                                            <AlertItem key={alert.id} {...alert} />
                                        ))
                                    ) : (
                                        <div className="h-full flex flex-col items-center justify-center text-center p-8 opacity-40">
                                            <Shield size={48} className="text-slate-600 mb-4" />
                                            <p className="text-slate-400 font-medium">No violations detected</p>
                                            <p className="text-xs text-slate-600 mt-2">Environment is currently secure</p>
                                        </div>
                                    )}
                                </div>
                                <div className="p-4 bg-white/[0.02] border-t border-white/5">
                                    <button
                                        onClick={() => setAlerts([])}
                                        className="w-full p-2.5 text-xs font-bold text-slate-500 hover:text-slate-300 transition-colors uppercase tracking-widest"
                                    >
                                        Clear Investigation Log
                                    </button>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
